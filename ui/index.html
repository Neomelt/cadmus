<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cadmus</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: Canvas; color: CanvasText;
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  #shelf { padding: max(1.2rem, env(safe-area-inset-top)) 1.25rem 2rem; max-width: 46rem; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: .5rem; margin: .8rem 0 1.6rem; }
  .brand { display: flex; align-items: baseline; gap: .5rem; }
  .brand .alpha { font-family: Georgia, "Noto Serif", serif; font-size: 2rem; line-height: 1; }
  .brand h1 { font-size: 1.35rem; margin: 0; letter-spacing: .05em; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    font: inherit; font-size: .9rem; padding: .42rem .8rem; cursor: pointer;
    border: 1px solid rgba(127, 127, 127, .35); border-radius: 999px;
    background: transparent; color: CanvasText;
  }
  .topbar button.primary { border-color: transparent; background: CanvasText; color: Canvas; }
  .section-title { font-size: .78rem; letter-spacing: .14em; opacity: .5; margin: 0 0 .7rem; }
  .books { display: grid; gap: .8rem; }
  .book {
    position: relative; display: flex; gap: 1rem; align-items: center;
    padding: .95rem 1rem; border-radius: 14px;
    border: 1px solid rgba(127, 127, 127, .28); cursor: pointer;
  }
  .book:active { transform: scale(.995); }
  .book .cover {
    width: 54px; height: 74px; border-radius: 5px; flex: none; overflow: hidden;
    background: linear-gradient(160deg, #22303F, #18212E);
    display: grid; place-items: center;
    color: #F3EAD8; font-family: Georgia, serif; font-size: 1.4rem;
  }
  .book .cover img { width: 100%; height: 100%; object-fit: cover; }
  .book .meta { min-width: 0; flex: 1; }
  .book .meta h2 { margin: 0 0 .22rem; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book .meta p { margin: 0 0 .45rem; font-size: .8rem; opacity: .55; }
  .bar { height: 4px; border-radius: 2px; background: rgba(127, 127, 127, .25); overflow: hidden; }
  .bar i { display: block; height: 100%; background: currentColor; opacity: .65; }
  .book .tag { position: absolute; top: .6rem; right: .75rem; font-size: .7rem; opacity: .45; }
  body.manage .book .tag { display: none; }
  .book .del {
    display: none; flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%;
    border: 1px solid rgba(210, 80, 80, .65); background: transparent;
    color: #d9534f; font-size: 1rem; cursor: pointer;
  }
  body.manage .book .del { display: grid; place-items: center; }
  .hint { margin-top: 1.6rem; font-size: .8rem; opacity: .42; line-height: 1.8; }
  #reader { position: fixed; inset: 0; display: none; background: Canvas; }
  #reader.open { display: block; }
  #reader iframe { width: 100%; height: 100%; border: 0; }
  #back {
    position: fixed; z-index: 10;
    top: max(.6rem, env(safe-area-inset-top)); left: max(.6rem, env(safe-area-inset-left));
    display: none; padding: .45rem .85rem; border-radius: 999px;
    border: 1px solid rgba(127, 127, 127, .35);
    background: Canvas; color: CanvasText; font: inherit; font-size: .85rem; cursor: pointer;
  }
  #back.open { display: inline-flex; }
  #btn-ann {
    position: fixed; z-index: 10;
    top: max(.6rem, env(safe-area-inset-top)); right: max(.6rem, env(safe-area-inset-right));
    display: none; padding: .45rem .85rem; border-radius: 999px;
    border: 1px solid rgba(127, 127, 127, .35);
    background: Canvas; color: CanvasText; font: inherit; font-size: .85rem; cursor: pointer;
  }
  #btn-ann.open { display: inline-flex; }
  #ann-panel {
    position: fixed; z-index: 20; top: 0; bottom: 0; right: 0;
    width: min(92vw, 24rem); overflow: auto;
    background: Canvas; border-left: 1px solid rgba(127, 127, 127, .28);
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom));
    transform: translateX(102%); transition: transform .2s ease;
  }
  #ann-panel.open { transform: none; }
  #ann-panel h3 { margin: 0 0 .8rem; font-size: .95rem; }
  .ann-filter { display: flex; gap: .4rem; margin-bottom: .8rem; flex-wrap: wrap; }
  .ann-filter button {
    font: inherit; font-size: .78rem; padding: .25rem .6rem; border-radius: 999px;
    border: 1px solid rgba(127, 127, 127, .35); background: transparent; color: CanvasText; cursor: pointer;
  }
  .ann-filter button.on { background: CanvasText; color: Canvas; border-color: transparent; }
  .ann-item { display: flex; gap: .6rem; padding: .7rem .2rem; border-bottom: 1px solid rgba(127, 127, 127, .18); }
  .ann-item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: .35rem; flex: none; }
  .ann-item .dot.yellow { background: #f2c94c; }
  .ann-item .dot.green { background: #7ed957; }
  .ann-item .dot.blue { background: #5ea8ff; }
  .ann-item .dot.pink { background: #ff8fc3; }
  .ann-item .body { flex: 1; min-width: 0; cursor: pointer; }
  .ann-item .quote { margin: 0 0 .3rem; font-size: .88rem; line-height: 1.5; }
  .ann-item .note { margin: 0 0 .3rem; font-size: .82rem; opacity: .75; }
  .ann-item .when { font-size: .72rem; opacity: .45; }
  .ann-item .rm {
    flex: none; align-self: flex-start; font: inherit; font-size: .78rem;
    color: #d9534f; background: transparent; border: 0; cursor: pointer; padding: .15rem .3rem;
  }
  .ann-empty { font-size: .85rem; opacity: .5; padding: 1rem 0; }
  .ann-sub { margin-top: 1.3rem; }
  .ann-export {
    margin-top: 1.4rem; width: 100%; font: inherit; font-size: .9rem;
    padding: .6rem; border-radius: 10px;
    border: 1px solid rgba(127, 127, 127, .35);
    background: transparent; color: CanvasText; cursor: pointer;
  }
  .loading { padding: 3rem 1rem; text-align: center; opacity: .5; }
  #toast {
    position: fixed; z-index: 50; left: 50%; bottom: max(1.2rem, env(safe-area-inset-bottom));
    transform: translateX(-50%); max-width: 82vw;
    padding: .6rem 1rem; border-radius: 10px;
    background: rgba(0, 0, 0, .82); color: #fff; font-size: .85rem;
    display: none;
  }
  #toast.show { display: block; }
  .bridge-error {
    margin: 1rem; padding: .8rem 1rem; border-radius: 10px;
    background: rgba(200, 60, 60, .12); color: #c0392b; font-size: .85rem;
  }
</style>
</head>
<body>
<main id="shelf">
  <div class="topbar">
    <div class="brand"><span class="alpha">α</span><h1>cadmus</h1></div>
    <span class="spacer"></span>
    <button id="btn-manage">管理</button>
    <button id="btn-import" class="primary">导入</button>
  </div>
  <p class="section-title">书库</p>
  <div class="books" id="books"></div>
  <p class="hint">
    支持导入 EPUB / TXT / PDF。导入后在书库点开阅读；导出标注到 Markdown 在「标注」面板。<br>
    阅读设置（字号 / 行距 / 行宽 / 字体 / 主题）在阅读页的「Aa 设置」里。
  </p>
</main>

<div id="reader">
  <div class="loading" id="loading">正在打开…</div>
  <iframe id="frame" title="reader" hidden></iframe>
</div>
<button id="back">‹ 书库</button>
<button id="btn-ann">标注</button>
<aside id="ann-panel">
  <h3>标注</h3>
  <div class="ann-filter" id="ann-filter"></div>
  <div id="ann-list"></div>
  <h3 class="ann-sub">书签</h3>
  <div id="bm-list"></div>
  <button id="btn-export" class="ann-export">导出 Markdown</button>
</aside>
<div id="toast"></div>

<script>
  (function () {
    const bridge = window.__TAURI__ && window.__TAURI__.core;
    if (!bridge) {
      document.body.insertAdjacentHTML(
        'afterbegin',
        '<p class="bridge-error">Tauri 桥接未注入（window.__TAURI__ 不存在），请报告此状态。</p>'
      );
      return;
    }
    const invoke = bridge.invoke;
    const booksEl = document.getElementById('books');
    const reader = document.getElementById('reader');
    const frame = document.getElementById('frame');
    const back = document.getElementById('back');
    const loading = document.getElementById('loading');
    const toast = document.getElementById('toast');
    let current = null;
    let saveTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
    }

    function fmtSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    }

    async function refresh() {
      try {
        const list = await invoke('list_books');
        booksEl.innerHTML = '';
        list.forEach(function (book) {
          const card = document.createElement('div');
          card.className = 'book';
          card.innerHTML =
            '<div class="cover"></div>' +
            '<div class="meta"><h2></h2><p></p><div class="bar"><i></i></div></div>' +
            '<span class="tag"></span>' +
            '<button class="del" title="删除">✕</button>';
          const cover = card.querySelector('.cover');
          if (book.cover_data) {
            const img = document.createElement('img');
            img.src = book.cover_data;
            img.alt = '';
            cover.appendChild(img);
          } else {
            cover.textContent = 'α';
          }
          const pct = Math.round((book.progress || 0) * 100);
          card.querySelector('h2').textContent = book.title;
          card.querySelector('p').textContent =
            (book.author || '未知作者') + ' · 已读 ' + pct + '%';
          card.querySelector('.bar i').style.width = pct + '%';
          card.querySelector('.tag').textContent =
            book.builtin ? '内置' : (book.format.toUpperCase() + ' · ' + fmtSize(book.size));
          card.addEventListener('click', function () {
            if (document.body.classList.contains('manage')) return;
            openBook(book.id, book.format);
          });
          card.querySelector('.del').addEventListener('click', async function (event) {
            event.stopPropagation();
            try {
              const yes = await invoke('plugin:dialog|ask', {
                title: '删除书籍',
                message: '删除《' + book.title + '》？',
                kind: 'warning'
              });
              if (!yes) return;
              await invoke('delete_book', { id: book.id });
              showToast('已删除');
              refresh();
            } catch (error) {
              showToast('删除失败：' + error);
            }
          });
          booksEl.appendChild(card);
        });
      } catch (error) {
        showToast('书库加载失败：' + error);
      }
    }

    async function openBook(id, format) {
      current = id;
      reader.classList.add('open');
      back.classList.add('open');
      btnAnn.classList.add('open');
      loading.style.display = 'block';
      loading.textContent = format === 'pdf' ? '正在排版…（首次打开需要重排）' : '正在打开…';
      frame.hidden = true;
      try {
        const html = await invoke('read_book', { id: id });
        frame.onload = function () {
          loading.style.display = 'none';
          frame.hidden = false;
          restoreProgress();
          refreshAnnotations();
          saveTimer = setInterval(saveProgress, 5000);
        };
        frame.srcdoc = html;
      } catch (error) {
        loading.textContent = '打开失败：' + error;
      }
    }

    function readingProgress() {
      try {
        const win = frame.contentWindow;
        const max = win.document.documentElement.scrollHeight - win.innerHeight;
        if (max <= 0) return null;
        return Math.min(1, Math.max(0, win.scrollY / max));
      } catch (error) {
        return null;
      }
    }

    async function saveProgress() {
      if (!current) return;
      const progress = readingProgress();
      if (progress === null) return;
      try {
        await invoke('save_progress', { id: current, progress: progress });
      } catch (error) {}
    }

    async function restoreProgress() {
      try {
        const list = await invoke('list_books');
        const book = list.find(function (item) { return item.id === current; });
        if (!book || !book.progress) return;
        const win = frame.contentWindow;
        const max = win.document.documentElement.scrollHeight - win.innerHeight;
        if (max > 0) win.scrollTo(0, book.progress * max);
      } catch (error) {}
    }

    function closeReader() {
      saveProgress();
      if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }
      current = null;
      reader.classList.remove('open');
      back.classList.remove('open');
      btnAnn.classList.remove('open');
      toggleAnnPanel(false);
      annotations = [];
      frame.srcdoc = '';
      setTimeout(refresh, 250);
    }
    back.addEventListener('click', closeReader);

    document.getElementById('btn-manage').addEventListener('click', function () {
      const on = document.body.classList.toggle('manage');
      this.textContent = on ? '完成' : '管理';
    });

    document.getElementById('btn-import').addEventListener('click', async function () {
      try {
        const picked = await invoke('plugin:dialog|open', {
          options: {
            multiple: true,
            filters: [{ name: '电子书', extensions: ['epub', 'txt', 'pdf'] }]
          }
        });
        if (!picked) return;
        const paths = Array.isArray(picked) ? picked : [picked];
        let ok = 0;
        const errors = [];
        for (const path of paths) {
          try {
            await invoke('import_book', { path: path });
            ok++;
          } catch (error) {
            errors.push(String(error));
          }
        }
        if (ok > 0) showToast('已导入 ' + ok + ' 本');
        if (errors.length > 0) showToast('导入失败：' + errors[0]);
        refresh();
      } catch (error) {
        showToast('打开文件选择器失败：' + error);
      }
    });

    // ---- 标注面板与消息桥 ----
    const annPanel = document.getElementById('ann-panel');
    const annList = document.getElementById('ann-list');
    const annFilter = document.getElementById('ann-filter');
    const btnAnn = document.getElementById('btn-ann');
    let annotations = [];
    let bookmarks = [];
    let annColorFilter = 'all';
    let annPanelOpen = false;

    function fmtTime(ts) {
      try {
        const d = new Date(ts * 1000);
        const pad = function (n) { return String(n).padStart(2, '0'); };
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      } catch (error) { return ''; }
    }

    function renderAnnList() {
      const filters = [['all', '全部'], ['yellow', '黄'], ['green', '绿'], ['blue', '蓝'], ['pink', '粉']];
      annFilter.innerHTML = '';
      filters.forEach(function (pair) {
        const b = document.createElement('button');
        b.textContent = pair[1];
        if (annColorFilter === pair[0]) b.classList.add('on');
        b.addEventListener('click', function () { annColorFilter = pair[0]; renderAnnList(); });
        annFilter.appendChild(b);
      });
      const items = annotations.filter(function (item) {
        return annColorFilter === 'all' || item.color === annColorFilter;
      });
      annList.innerHTML = '';
      if (items.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'ann-empty';
        empty.textContent = '还没有标注。在正文里选中文字即可高亮。';
        annList.appendChild(empty);
        return;
      }
      items.slice().sort(function (a, b) { return b.created_at - a.created_at; }).forEach(function (item) {
        const row = document.createElement('div');
        row.className = 'ann-item';
        const dot = document.createElement('span');
        dot.className = 'dot ' + item.color;
        row.appendChild(dot);
        const body = document.createElement('div');
        body.className = 'body';
        const quote = document.createElement('p');
        quote.className = 'quote';
        quote.textContent = '「' + item.text + '」';
        body.appendChild(quote);
        if (item.note) {
          const note = document.createElement('p');
          note.className = 'note';
          note.textContent = '✎ ' + item.note;
          body.appendChild(note);
        }
        const when = document.createElement('span');
        when.className = 'when';
        when.textContent = fmtTime(item.created_at);
        body.appendChild(when);
        body.addEventListener('click', function () {
          try {
            frame.contentWindow.postMessage({ type: 'cadmus:jump', annId: item.id }, '*');
          } catch (error) {}
          toggleAnnPanel(false);
        });
        row.appendChild(body);
        const rm = document.createElement('button');
        rm.className = 'rm';
        rm.textContent = '删除';
        rm.addEventListener('click', async function () {
          try {
            await invoke('delete_annotation', { id: current, annId: item.id });
            annotations = annotations.filter(function (x) { return x.id !== item.id; });
            renderAnnList();
            try {
              frame.contentWindow.postMessage({ type: 'cadmus:removeMark', id: item.id }, '*');
            } catch (error) {}
          } catch (error) {
            showToast('删除失败：' + error);
          }
        });
        row.appendChild(rm);
        annList.appendChild(row);
      });
      const bmList = document.getElementById('bm-list');
      bmList.innerHTML = '';
      if (bookmarks.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'ann-empty';
        empty.textContent = '还没有书签。阅读页顶栏点「书签」即可添加。';
        bmList.appendChild(empty);
      } else {
        bookmarks.slice().sort(function (a, b) { return a.progress - b.progress; }).forEach(function (item) {
          const row = document.createElement('div');
          row.className = 'ann-item';
          const body = document.createElement('div');
          body.className = 'body';
          const quote = document.createElement('p');
          quote.className = 'quote';
          quote.textContent = (item.label || '书签') + ' · ' + Math.round((item.progress || 0) * 100) + '%';
          body.appendChild(quote);
          body.addEventListener('click', function () {
            try {
              if (item.block_id) {
                frame.contentWindow.postMessage({ type: 'cadmus:jump', blockId: item.block_id }, '*');
              } else {
                jumpByProgress(item.progress || 0);
              }
            } catch (error) {}
            toggleAnnPanel(false);
          });
          row.appendChild(body);
          const rm = document.createElement('button');
          rm.className = 'rm';
          rm.textContent = '删除';
          rm.addEventListener('click', async function () {
            try {
              await invoke('delete_bookmark', { id: current, bookmarkId: item.id });
              bookmarks = bookmarks.filter(function (x) { return x.id !== item.id; });
              renderAnnList();
            } catch (error) {
              showToast('删除失败：' + error);
            }
          });
          row.appendChild(rm);
          bmList.appendChild(row);
        });
      }
    }

    function jumpByProgress(progress) {
      try {
        const win = frame.contentWindow;
        const max = win.document.documentElement.scrollHeight - win.innerHeight;
        if (max > 0) win.scrollTo(0, progress * max);
      } catch (error) {}
    }

    async function refreshAnnotations() {
      if (!current) return;
      try {
        const store = await invoke('list_annotations', { id: current });
        annotations = (store && store.annotations) || [];
        bookmarks = (store && store.bookmarks) || [];
        renderAnnList();
      } catch (error) {}
    }

    function toggleAnnPanel(open) {
      annPanelOpen = open === undefined ? !annPanelOpen : open;
      annPanel.classList.toggle('open', annPanelOpen);
    }

    btnAnn.addEventListener('click', function () {
      toggleAnnPanel();
      if (annPanelOpen) refreshAnnotations();
    });

    document.getElementById('btn-export').addEventListener('click', async function () {
      try {
        const path = await invoke('export_markdown', { id: current });
        showToast('已导出：' + path);
      } catch (error) {
        showToast('导出失败：' + error);
      }
    });

    window.addEventListener('message', async function (event) {
      if (!frame.contentWindow || event.source !== frame.contentWindow) return;
      const data = event.data || {};
      if (data.type === 'cadmus:addAnnotation') {
        try {
          const ann = await invoke('add_annotation', {
            id: current,
            blockId: data.blockId,
            start: data.start,
            end: data.end,
            text: data.text,
            color: data.color
          });
          frame.contentWindow.postMessage({ type: 'cadmus:annotationSaved', id: ann.id, color: ann.color }, '*');
          refreshAnnotations();
        } catch (error) {
          showToast('高亮失败：' + error);
        }
      } else if (data.type === 'cadmus:annotationUpdated') {
        try {
          await invoke('update_annotation', {
            id: current,
            annId: data.id,
            color: data.color === undefined ? null : data.color,
            note: data.note === undefined ? null : data.note
          });
          refreshAnnotations();
        } catch (error) {
          showToast('保存失败：' + error);
        }
      } else if (data.type === 'cadmus:addBookmark') {
        try {
          const progress = readingProgress() || 0;
          await invoke('add_bookmark', {
            id: current,
            blockId: data.blockId || null,
            label: data.label || '',
            progress: progress
          });
          showToast('已加书签');
          refreshAnnotations();
        } catch (error) {
          showToast('加书签失败：' + error);
        }
      } else if (data.type === 'cadmus:annotationDeleted') {
        try {
          await invoke('delete_annotation', { id: current, annId: data.id });
          refreshAnnotations();
        } catch (error) {
          showToast('删除失败：' + error);
        }
      }
    });

    refresh();
  })();
</script>
</body>
</html>
