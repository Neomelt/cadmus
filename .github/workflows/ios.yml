name: ios

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "ui/**"
      - "package.json"
      - ".github/workflows/ios.yml"

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: install tauri cli
        run: npm install -g @tauri-apps/cli@^2
      - name: ios init
        run: tauri ios init --ci
      - name: apply app icons and device family
        run: |
          cp -f src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "2"/g' src-tauri/gen/apple/cadmus.xcodeproj/project.pbxproj
          echo "ipad-only targets: $(grep -c 'TARGETED_DEVICE_FAMILY = "2"' src-tauri/gen/apple/cadmus.xcodeproj/project.pbxproj)"
      - name: enable files app visibility
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 3 -name Info.plist -path '*_iOS*' | head -1)
          test -n "$PLIST"
          echo "plist=$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          plutil -p "$PLIST" | grep -iE 'UIFileSharing|LSSupports'
      - name: upload generated xcode project
        uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: src-tauri/gen/apple
          if-no-files-found: warn
      - name: link tauri cli for xcode script phase
        run: |
          CLI_JS="$(npm root -g)/@tauri-apps/cli/tauri.js"
          ls -la "$CLI_JS"
          printf 'import { pathToFileURL } from "node:url";\nawait import(pathToFileURL("%s").href);\n' "$CLI_JS" > src-tauri/gen/apple/tauri
          cat src-tauri/gen/apple/tauri
      - name: build unsigned ipa
        run: |
          tauri ios build --no-sign --ci 2>&1 | tee /tmp/ios-build.log
      - name: fetch pdfium (iOS arm64)
        run: |
          curl -sL --retry 3 -o /tmp/pdfium-ios.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8086/pdfium-ios-device-arm64.tgz"
          mkdir -p /tmp/pdfium
          tar xzf /tmp/pdfium-ios.tgz -C /tmp/pdfium lib/libpdfium.dylib
          file /tmp/pdfium/lib/libpdfium.dylib
          ls -la /tmp/pdfium/lib
      - name: embed pdfium into ipa
        run: |
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          echo "ipa=$IPA"
          test -n "$IPA"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa
          unzip -q "$IPA" -d /tmp/ipa
          APP=$(find /tmp/ipa/Payload -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p "$APP/Frameworks"
          cp /tmp/pdfium/lib/libpdfium.dylib "$APP/Frameworks/"
          (cd /tmp/ipa && zip -qry "$OLDPWD/$IPA" Payload)
          echo "embedded: $(unzip -l "$IPA" | grep -c libpdfium) 个 libpdfium 条目"
      - name: locate ipa
        run: |
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          echo "ipa=$IPA"
          test -n "$IPA"
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "$IPA" "cadmus-${VERSION}-unsigned.ipa"
          ls -la "cadmus-${VERSION}-unsigned.ipa"
          echo "### iOS IPA：cadmus-${VERSION}-unsigned.ipa（未签名，SideStore 侧载）" >> "$GITHUB_STEP_SUMMARY"
      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: cadmus-ipa
          path: cadmus-*-unsigned.ipa
          if-no-files-found: error
