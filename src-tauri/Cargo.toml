[package]
name = "cadmus"
version = "0.2.2"
description = "cadmus 阅读器（Tauri 2 壳）"
authors = ["Neomelt"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadmus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cadmus-core = { path = "../crates/cadmus-core" }
cadmus-epub = { path = "../crates/cadmus-epub" }
cadmus-preview = { path = "../crates/cadmus-preview" }
cadmus-reflow = { path = "../crates/cadmus-reflow" }

# iOS：读取文件选择器带回的沙箱外文件需要开启安全作用域（与官方 fs 插件同款依赖）。
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString"] }
url = "2"

[dev-dependencies]
# 测试中现场构造含图 EPUB。
zip = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 独立 workspace：不并入仓库根 workspace，Tauri 移动端工具链按自身解析依赖。
[workspace]
